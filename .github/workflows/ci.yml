name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel older runs for the same branch / PR — saves runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Print versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        # Non-blocking for now — flip to `--set-exit-if-changed` once the
        # codebase has been formatted once.
        run: dart format --output=none .

      - name: Static analysis
        # `--no-fatal-infos` keeps errors + warnings blocking (which we want
        # to enforce) while tolerating info-level deprecation hints in legacy
        # screens. Drop the flag once `dart fix --apply` has cleaned those up.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

  build-android-debug:
    name: Build Android (debug smoke)
    # Only run the slow Android build on pushes to main / develop, and skip
    # on PRs where fast analyze+test feedback is what matters. Saves ~5–10
    # min of runner time per PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java with built-in Gradle caching — huge speedup on subsequent runs.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      # Auto-accept Android SDK licenses. Without this, Gradle may hang
      # silently on first-time AGP setup waiting for `y` on each license.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # Cache Pub packages so `flutter pub get` is near-instant on re-runs.
      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Force non-interactive Gradle so it can't block on prompts.
          # `--no-daemon` avoids leftover daemons holding state across steps.
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx3g'
        run: flutter build apk --debug --dart-define=GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
